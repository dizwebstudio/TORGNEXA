        '200':
          description: Replay-safe authorization URL with PKCE S256 and bounded one-time state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorOAuthStartResult'}
        '400': {description: Callback is outside the exact deployment allowlist or request is invalid}
        '409': {description: Account version or idempotency conflict}
        '422': {description: Connector does not declare a browser authorization-code flow or client registration is missing}
  /connector-accounts:oauth-callback:
    post:
      operationId: completeConnectorOAuth
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectorOAuthCallback'}
