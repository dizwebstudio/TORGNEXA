    ExternalNotificationsPreferenceV1:
      title: TORGNEXA Notification Preference v1
      type: object
      additionalProperties: false
      required:
      - recipient_id
      - channel
      - enabled
      - min_severity
      - categories
      - quiet_enabled
      - quiet_start
      - quiet_end
      - timezone
      - version
      - updated_at
      properties:
        recipient_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
        channel:
          enum:
          - web_ui
          - webhook
          - email
          - sms
        enabled:
          type: boolean
        min_severity:
          enum:
          - info
          - warning
          - critical
        categories: {$ref: '#/components/schemas/NotificationCategories'}
        quiet_enabled: {type: boolean}
        quiet_start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        quiet_end: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        timezone: {type: string, minLength: 1, maxLength: 64}
        version:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
          pattern: Z$
    NotificationCategories:
      type: array
      minItems: 1
      maxItems: 6
      uniqueItems: true
      items: {type: string, enum: [commerce, inventory, integrations, compliance, security, system]}
    ExternalPluginsManifestV2:
      title: TORGNEXA Connector Manifest v2 / SDK v1
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - family
      - version
      - sdk_version
      - capabilities
      - auth
      - rate_limit
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        family:
          enum:
          - marketplace
          - classified
          - social
          - erp
          - edo
          - government
          - payment
          - logistics
          - pickup
          - fx
          - notification
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$
        sdk_version:
          const: 1
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - products.read
            - products.write
            - prices.read
            - prices.write
            - inventory.read
            - inventory.write
            - orders.read
            - notifications.receive
            - orders.status.write
            - returns.read
            - reviews.read
            - reviews.reply
            - messages.read
            - messages.reply
            - ads.read
            - ads.manage
            - promotions.read
            - promotions.manage
            - finance.settlements.read
            - social.post.text
            - social.post.media
            - social.post.video
            - social.post.edit
            - social.post.delete
            - social.comments.read
            - social.comments.reply
            - social.analytics.read
            - erp.catalog.read
            - erp.catalog.write
            - erp.inventory.read
            - erp.orders.read
            - erp.orders.write
            - edo.documents.read
            - edo.documents.send
            - edo.documents.sign_request
            - marking.status.read
            - marking.documents.write
            - fiscal.receipts.write
            - vetis.documents.read
            - vetis.documents.write
            - payments.create
            - payments.refund
            - payments.reconcile
            - logistics.rates.read
            - logistics.shipment.create
            - logistics.track.read
            - logistics.return.create
            - pickup.points.read
            - pickup.capacity.read
            - pickup.orders.write
            - compliance.documents.read
            - compliance.documents.write
            - compliance.evaluate
            - government.identity.read
            - government.documents.read
            - government.documents.write
            - government.inventory.read
            - government.references.read
            - government.reconciliation.run
            - payments.status.read
            - payments.webhooks
            - logistics.shipment.cancel
            - logistics.label.read
            - fx.rates.read
            - notifications.sms.send
            - notifications.sms.status.read
        auth:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - required
            properties:
              kind:
                enum:
                - none
                - api_key
                - bearer
                - basic
                - oauth2
                - certificate
              secret_class:
                type: string
                pattern: ^[a-z][a-z0-9._-]{0,63}$
              required:
                type: boolean
            allOf:
            - if:
                properties:
                  kind:
                    const: none
              then:
                properties:
                  required:
                    const: false
                not:
                  required:
                  - secret_class
            - if:
                properties:
                  required:
                    const: true
              then:
                if:
                  properties:
                    kind:
                      not:
                        const: none
                then:
                  required:
                  - secret_class
        rate_limit:
          type: object
          additionalProperties: false
          required:
          - max_concurrency
          - min_interval_ms
          - request_timeout_ms
          - retry
          properties:
            max_concurrency:
              type: integer
              minimum: 1
              maximum: 1024
            min_interval_ms:
              type: integer
              minimum: 0
              maximum: 60000
            request_timeout_ms:
              type: integer
              minimum: 100
              maximum: 300000
            retry:
              type: object
              additionalProperties: false
              required:
              - max_attempts
              - base_backoff_ms
              - max_backoff_ms
              properties:
                max_attempts:
                  type: integer
                  minimum: 1
                  maximum: 20
                base_backoff_ms:
                  type: integer
                  minimum: 1
                  maximum: 300000
                max_backoff_ms:
                  type: integer
                  minimum: 1
                  maximum: 300000
      description: Additive manifest contract for Connector SDK v1. Family/capability compatibility is additionally enforced by
        the executable SDK registry.
    ExternalPluginsMarketplaceListingV1:
