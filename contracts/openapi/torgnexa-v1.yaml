          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorAccountSettings'}
        '400': {description: Invalid request or idempotency key}
        '401': {description: Missing or invalid OIDC bearer token}
        '403': {description: Identity has no reviewed tenant mapping or write permission}
        '409': {description: Concurrent account update}
        '422': {description: A selected capability is not declared by the manifest or has no executable route in the current runtime}
  /connector-accounts:check:
    post:
      operationId: checkConnectorAccount
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
