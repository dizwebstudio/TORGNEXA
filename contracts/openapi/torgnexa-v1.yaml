openapi: 3.1.0
info:
  title: TORGNEXA API
  version: 0.21.2
servers:
  - url: /api/v1
paths:
  /publication-quality/runs:
    get:
      operationId: listPublicationQualityRuns
      security: [{bearerAuth: []}]
      parameters:
        - {name: product_id, in: query, required: false, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Tenant-scoped publication quality decisions, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationQualityRunPage'}}}}
        '400': {description: Invalid quality query}
        '403': {description: Caller lacks products.read}
  /publication-quality/runs/{run_id}:
    get:
      operationId: getPublicationQualityRun
      security: [{bearerAuth: []}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      responses:
        '200': {description: Quality run with bounded issues, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationQualityRun'}}}}
        '404': {description: Quality run not found}
  /publication-quality/receipts/{receipt_id}:
    get:
      operationId: getPublicationQualityReceipt
      security: [{bearerAuth: []}]
      parameters:
        - {name: receipt_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      responses:
        '200': {description: Exact-match publication gate receipt, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationQualityGateReceipt'}}}}
        '404': {description: Quality receipt not found}
  /marketplace-publications/preflight:
    post:
      operationId: preflightMarketplacePublication
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublicationPreflight'}}}}
      responses:
        '200': {description: Snapshot and quality receipt passed the local publication gate, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublicationPreflightResult'}}}}
        '409': {description: 'Marketplace account capability is unavailable for this target'}
        '422': {description: 'Quality receipt is missing, stale or does not match the snapshot'}
  /marketplace-publications:
    get:
      operationId: listMarketplacePublications
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Recent tenant-scoped marketplace publication operations, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublicationPage'}}}}
    post:
      operationId: enqueueMarketplacePublication
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: Approval-Request-ID, in: header, required: false, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublicationRequest'}}}}
      responses:
        '202': {description: Publication snapshot durably queued after preflight, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublication'}}}}
        '409': {description: 'Account capability or approved publication request is unavailable'}
        '422': {description: 'Quality receipt is missing, stale or does not match the snapshot'}
  /marketplace-publications/{operation_id}:
    get:
      operationId: getMarketplacePublication
      security: [{bearerAuth: []}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      responses:
        '200': {description: Publication operation with normalized state only, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublication'}}}}
        '404': {description: Publication operation not found}
  /marketplace-publications/{operation_id}/retry:
    post:
      operationId: retryMarketplacePublication
      security: [{bearerAuth: []}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: Unresolved publication operation returned to the durable queue, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublication'}}}}
        '409': {description: Only an unknown or needs-attention operation can be retried}
  /marketplace-publications/{operation_id}/drifts:
    get:
      operationId: listMarketplacePublicationDrifts
      security: [{bearerAuth: []}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      responses:
        '200': {description: Redacted reconciliation findings for the operation, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplacePublicationDriftPage'}}}}
        '404': {description: Publication operation not found}
  /marketplace-listings/taxonomy:
    get:
      operationId: getMarketplaceListingTaxonomy
      security: [{bearerAuth: []}]
      parameters:
        - {name: taxonomy_id, in: query, required: false, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
        - {name: connector_id, in: query, required: false, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
        - {name: locale, in: query, required: false, schema: {type: string, maxLength: 16}}
        - {name: jurisdiction, in: query, required: false, schema: {type: string, pattern: '^[A-Z]{2}$'}}
      responses:
        '200': {description: Normalized channel taxonomy, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingTaxonomy'}}}}
        '404': {description: Taxonomy is not stored for this tenant}
  /marketplace-listings/batch/preview:
    post:
      operationId: previewMarketplaceListingBatch
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingBatchPreviewRequest'}}}}
      responses:
        '200': {description: Deterministic before/after preview for up to 1000 SKU, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingBatchPreview'}}}}
        '413': {description: Batch exceeds the 1000 SKU limit}
  /marketplace-listings/batch/apply:
    post:
      operationId: applyMarketplaceListingBatch
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: Approval-Request-ID, in: header, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingBatchApplyRequest'}}}}
      responses:
        '202': {description: Approved batch durably queued for a qualified connector, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingBatchRun'}}}}
        '409': {description: Matching approval or connector qualification is unavailable}
  /marketplace-listings/batches/{batch_id}:
    get:
      operationId: getMarketplaceListingBatch
      security: [{bearerAuth: []}]
      parameters:
        - {name: batch_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      responses:
        '200': {description: Durable listing batch state, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingBatchRun'}}}}
        '404': {description: Batch not found}
  /marketplace-listings/read-after-write:
    post:
      operationId: readAfterWriteMarketplaceListing
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingReadAfterWrite'}}}}
      responses:
        '200': {description: Normalized remote observation and reconciliation drifts, content: {application/json: {schema: {$ref: '#/components/schemas/MarketplaceListingReconciliation'}}}}
        '409': {description: Remote state is not consistent with the expected draft}
  /catalog/bulk/summary:
    get:
      operationId: listCatalogBulkChannels
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Effective bulk catalog channel capabilities, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkChannelPage'}}}}
  /catalog/bulk/previews:
    get:
      operationId: listCatalogBulkPreviews
      security: [{bearerAuth: []}]
      parameters:
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Cursor page of immutable catalog bulk previews, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkPreviewPage'}}}}
    post:
      operationId: previewCatalogBulk
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkPreviewRequest'}}}}
      responses:
        '200': {description: Immutable multi-channel before/after preview, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkPreview'}}}}
        '413': {description: Selection exceeds 1000 SKU or bounded channel fanout}
  /catalog/bulk/previews/{preview_id}:
    get:
      operationId: getCatalogBulkPreview
      security: [{bearerAuth: []}]
      parameters:
        - {name: preview_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      responses:
        '200': {description: Stored catalog bulk preview, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkPreview'}}}}
        '404': {description: Preview not found}
  /catalog/bulk/apply:
    post:
      operationId: applyCatalogBulk
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: Approval-Request-ID, in: header, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkApplyRequest'}}}}
      responses:
        '202': {description: Approved bulk operation queued by channel/account partitions, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkRun'}}}}
        '409': {description: 'Preview is stale, approval is missing or a channel is not qualified'}
  /catalog/bulk/runs/{run_id}:
    get:
      operationId: getCatalogBulkRun
      security: [{bearerAuth: []}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      responses:
        '200': {description: Durable per-row catalog bulk result, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkRun'}}}}
        '404': {description: Run not found}
  /catalog/bulk/runs:
    get:
      operationId: listCatalogBulkRuns
      security: [{bearerAuth: []}]
      parameters:
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 256}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Cursor page of durable catalog bulk runs, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkRunPage'}}}}
  /catalog/bulk/runs/{run_id}/reconcile:
    post:
      operationId: reconcileCatalogBulkRun
      security: [{bearerAuth: []}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkReconcileRequest'}}}}
      responses:
        '200': {description: Normalized read-after-write reconciliation result, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkReconciliation'}}}}
        '409': {description: Remote state is mismatched or unknown}
  /catalog/bulk/kill-switch:
    get:
      operationId: getCatalogBulkKillSwitch
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Workspace emergency stop state, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkKillSwitch'}}}}
    post:
      operationId: setCatalogBulkKillSwitch
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkKillSwitchWrite'}}}}
      responses:
        '200': {description: Updated workspace emergency stop state, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogBulkKillSwitch'}}}}
  /social/channels:
    get:
      operationId: listSocialChannels
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Tenant social channels, content: {application/json: {schema: {$ref: '#/components/schemas/SocialChannelPage'}}}}
        '403': {description: Caller lacks connectors.read}
    post:
      operationId: createSocialChannel
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialChannelCreate'}}}}
      responses:
        '201': {description: Social channel created, content: {application/json: {schema: {$ref: '#/components/schemas/SocialChannel'}}}}
        '409': {description: Connector account or text capability is unavailable}
  /social/channels/{channel_id}:
    put:
      operationId: updateSocialChannel
      security: [{bearerAuth: []}]
      parameters:
        - {name: channel_id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialChannelUpdate'}}}}
      responses:
        '200': {description: Social channel updated, content: {application/json: {schema: {$ref: '#/components/schemas/SocialChannel'}}}}
        '409': {description: Optimistic version or channel state conflict}
  /social/publications:
    get:
      operationId: listSocialPublications
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Recent tenant social publications, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublicationPage'}}}}
        '403': {description: Caller lacks connectors.read}
    post:
      operationId: createSocialPublication
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublicationCreate'}}}}
      responses:
        '202': {description: Canonical publication accepted for asynchronous delivery, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublication'}}}}
        '409': {description: 'Channel, content or idempotent replay conflict'}
  /social/publications/{publication_id}:
    patch:
      operationId: editSocialPublication
      security: [{bearerAuth: []}]
      parameters:
        - {name: publication_id, in: path, required: true, schema: {$ref: '#/components/schemas/SortableID'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: Approval-Request-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 192}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublicationEdit'}}}}
      responses:
        '201': {description: Remote social publication edited, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublicationEditResult'}}}}
        '202': {description: Previous edit is still pending and will not be repeated, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublicationEditPending'}}}}
        '409': {description: 'Approval, capability, receipt or idempotent replay conflict'}
        '502': {description: Social provider returned no confirmed result}
    delete:
      operationId: deleteSocialPublication
      security: [{bearerAuth: []}]
      parameters:
        - {name: publication_id, in: path, required: true, schema: {$ref: '#/components/schemas/SortableID'}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: Approval-Request-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 192}}
      responses:
        '201': {description: Remote social publication deleted, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublicationDeleteResult'}}}}
        '202': {description: Previous deletion is still pending and will not be repeated, content: {application/json: {schema: {$ref: '#/components/schemas/SocialPublicationDeletePending'}}}}
        '409': {description: 'Approval, capability, receipt or idempotent replay conflict'}
        '502': {description: Social provider returned no confirmed result}
  /social/webhooks/subscription:
    put:
      operationId: subscribeSocialWebhook
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialWebhookSubscription'}}}}
      responses:
        '201': {description: Telegram webhook subscription enabled, content: {application/json: {schema: {$ref: '#/components/schemas/SocialWebhookSubscriptionResult'}}}}
        '202': {description: Previous subscription operation is still pending and will not be repeated, content: {application/json: {schema: {$ref: '#/components/schemas/SocialWebhookSubscriptionPending'}}}}
        '400': {description: Invalid request or idempotency key}
        '403': {description: Caller lacks connectors.accounts.write}
        '409': {description: 'Social account, capability or idempotent replay conflict'}
        '502': {description: Social provider unavailable}
    delete:
      operationId: unsubscribeSocialWebhook
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SocialWebhookSubscription'}}}}
      responses:
        '201': {description: Telegram webhook subscription disabled, content: {application/json: {schema: {$ref: '#/components/schemas/SocialWebhookSubscriptionResult'}}}}
        '202': {description: Previous subscription operation is still pending and will not be repeated, content: {application/json: {schema: {$ref: '#/components/schemas/SocialWebhookSubscriptionPending'}}}}
        '400': {description: Invalid request or idempotency key}
        '403': {description: Caller lacks connectors.accounts.write}
        '409': {description: 'Social account, capability or idempotent replay conflict'}
        '502': {description: Social provider unavailable}
  /logistics/pickup-points:
    get:
      operationId: listLogisticsPickupPoints
      security: [{bearerAuth: []}]
      parameters:
        - {name: connector_account_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: country, in: query, required: true, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: city, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200': {description: Bounded pickup-point directory, content: {application/json: {schema: {$ref: '#/components/schemas/LogisticsPickupPointPage'}}}}
        '400': {description: Invalid pickup-point query}
        '403': {description: Caller lacks connectors.read}
        '409': {description: Logistics account or capability is unavailable}
        '502': {description: Logistics provider unavailable}
  /logistics/batches:
    get:
      operationId: listLogisticsBatches
      security: [{bearerAuth: []}]
      parameters:
        - {name: connector_account_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: mail_type, in: query, required: false, schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'}}
        - {name: mail_category, in: query, required: false, schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200': {description: Bounded Russian Post batch directory, content: {application/json: {schema: {$ref: '#/components/schemas/LogisticsBatchPage'}}}}
        '400': {description: Invalid batch query}
        '403': {description: Caller lacks connectors.read}
        '409': {description: Logistics account or capability is unavailable}
        '502': {description: Logistics provider unavailable}
    post:
      operationId: createLogisticsBatch
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: Approval-Request-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogisticsBatchCreateRequest'}
      responses:
        '201': {description: Remote batch formed, content: {application/json: {schema: {$ref: '#/components/schemas/LogisticsBatch'}}}}
        '202': {description: Batch formation outcome is pending and must not be retried automatically}
        '400': {description: Invalid batch or idempotency key}
        '403': {description: Caller lacks logistics.batches.create}
        '409': {description: 'Batch capability, approval or idempotency conflict'}
        '502': {description: Logistics provider unavailable}
  /logistics/batches/orders:
    get:
      operationId: listLogisticsBatchOrders
      security: [{bearerAuth: []}]
      parameters:
        - {name: connector_account_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: batch_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200': {description: Bounded order projections for one Russian Post batch, content: {application/json: {schema: {$ref: '#/components/schemas/LogisticsBatchOrderPage'}}}}
        '400': {description: Invalid batch-order query}
        '403': {description: Caller lacks connectors.read}
        '409': {description: Logistics account or capability is unavailable}
        '502': {description: Logistics provider unavailable}
  /logistics/batches/{batch_id}:
    get:
      operationId: getLogisticsBatch
      security: [{bearerAuth: []}]
      parameters:
        - {name: batch_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
        - {name: connector_account_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200': {description: Safe projection for one Russian Post batch, content: {application/json: {schema: {$ref: '#/components/schemas/LogisticsBatch'}}}}
        '400': {description: Invalid provider batch query}
        '403': {description: Caller lacks connectors.read}
        '409': {description: Logistics account or capability is unavailable}
        '502': {description: Logistics provider unavailable}
  /logistics/orders/{order_id}:
    get:
      operationId: getLogisticsOrder
      security: [{bearerAuth: []}]
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
