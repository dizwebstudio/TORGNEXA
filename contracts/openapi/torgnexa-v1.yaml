          pattern: ^[a-z][a-z0-9-]{1,62}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        family:
          enum:
          - marketplace
          - classified
          - social
          - erp
          - edo
          - government
          - payment
          - logistics
          - pickup
          - fx
          - notification
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$
        sdk_version:
          const: 1
        artifact_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        publisher_id:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
        publisher_key_id:
          type: string
