        categories: {$ref: '#/components/schemas/NotificationCategories'}
        quiet_enabled: {type: boolean}
        quiet_start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        quiet_end: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        timezone: {type: string, minLength: 1, maxLength: 64, default: Europe/Moscow}
