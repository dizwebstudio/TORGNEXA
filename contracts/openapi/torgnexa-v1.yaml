      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: flow_id, in: query, required: false, schema: {type: string, maxLength: 192, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$'}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [open, resolved]}}
      responses:
        '200':
          description: Tenant-scoped immutable marketplace findings
