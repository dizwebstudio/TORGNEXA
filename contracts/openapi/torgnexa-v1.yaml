      - updated_at
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^https://[^?#]+$
        event_types:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*\.[a-z][a-z0-9]*(_[a-z0-9]+)*\.[a-z][a-z0-9]*(_[a-z0-9]+)*\.v[1-9][0-9]{0,2}$
        status:
          type: string
          enum:
          - active
          - disabled
        consecutive_failures:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
