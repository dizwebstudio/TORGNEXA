      parameters: [{name: run_id, in: path, required: true, schema: {type: string, maxLength: 192}}]
      responses: {'200': {description: Run with grounded answer}, '404': {description: Run not found}}
  /assistant/runs/{run_id}:cancel:
    post:
      operationId: cancelAssistantRun
      security: [{bearerAuth: []}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 192}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantCancel'}}}}
      responses: {'200': {description: Run cancelled}, '409': {description: Version or lifecycle conflict}}
  /assistant/action-previews/{preview_id}:approve:
    post:
      operationId: approveAssistantActionPreview
      security: [{bearerAuth: []}]
      parameters:
        - {name: preview_id, in: path, required: true, schema: {type: string, pattern: '^ap:[0-9a-f]{26}$'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '409': {description: Approval must be created through the governed approval API}
  /assistant/feedback:
    post:
      operationId: recordAssistantFeedback
      security: [{bearerAuth: []}]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantFeedback'}}}}
      responses: {'202': {description: Feedback recorded}, '400': {description: Invalid feedback}}
  /reports:
    get:
      operationId: listReports
      responses:
        '200':
          description: Tenant-visible analytical report catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 16
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, title, description, source, availability, freshness_sla_seconds, dimensions, metrics]
                      properties:
                        id: {type: string, enum: [sales_daily, inventory_current, ingestion_freshness, unit_economics_by_channel]}
                        title: {type: string, minLength: 1, maxLength: 100}
                        description: {type: string, minLength: 1, maxLength: 300}
                        source: {type: string, enum: [clickhouse, postgresql]}
                        availability: {type: string, const: ready}
                        freshness_sla_seconds: {type: integer, minimum: 1, maximum: 3600}
                        dimensions: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string}}
                        metrics: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string}}
        '401': {description: Authenticated tenant scope missing}
        '403': {description: Caller lacks reports.read}
  /reports/{report_id}:
    get:
      operationId: getReportData
      parameters:
        - {name: report_id, in: path, required: true, schema: {type: string, enum: [sales_daily, inventory_current, ingestion_freshness, unit_economics_by_channel]}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: currency, in: query, required: false, schema: {type: string, pattern: '^[A-Z]{3}$'}}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 32}}
        - {name: completeness, in: query, required: false, schema: {type: string, enum: [complete, partial, stale, unmatched, conflict, mixed_currency, unsupported]}}
        - {name: basis, in: query, required: false, schema: {type: string, enum: [order_accrual, settlement, cash], default: order_accrual}}
        - {name: channel_ref, in: query, required: false, schema: {type: string, maxLength: 192}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [json, csv, pdf], default: json}}
      responses:
        '200':
          description: Bounded tenant-scoped ClickHouse analytical report result or generated export
          headers:
            Content-Disposition:
              description: Attachment filename for CSV and PDF exports
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, generated_at, source, columns, rows]
                properties:
                  id: {type: string, enum: [sales_daily, inventory_current, ingestion_freshness, unit_economics_by_channel]}
                  generated_at: {type: string, format: date-time}
                  source: {type: string, enum: [clickhouse, postgresql]}
                  columns:
                    type: array
                    minItems: 1
                    maxItems: 32
                    items:
                      type: object
                      additionalProperties: false
                      required: [key, label]
                      properties:
                        key: {type: string, minLength: 1, maxLength: 64}
                        label: {type: string, minLength: 1, maxLength: 100}
                  rows:
                    type: array
                    maxItems: 200
                    items:
                      type: array
                      maxItems: 32
                      items: {type: string, maxLength: 512}
            text/csv:
              schema: {type: string}
            application/pdf:
              schema: {type: string, format: binary}
        '401': {description: Authenticated tenant scope missing}
        '403': {description: Caller lacks reports.read}
        '404': {description: Unknown report}
        '400': {description: Invalid report filters}
  /realtime:
    get:
      operationId: streamRealtimeInvalidations
      description: Tenant-scoped Server-Sent Events stream carrying metadata-only cache invalidation and heartbeat signals. Entity data is re-read through normal authorized APIs.
      responses:
        '200':
          description: Streaming text/event-stream response
          content:
            text/event-stream:
              schema: {type: string}
        '401': {description: Authenticated tenant scope missing}
        '403': {description: Realtime read capability required}

  /audit:
    get:
      operationId: listAuditRecords
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200':
          description: Newest-first tenant-scoped append-only audit page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, actor_id, source, action, resource_type, resource_id, correlation_id, risk, summary, created_at]
                      properties:
                        id: {type: string, minLength: 1, maxLength: 128}
                        actor_id: {type: string, minLength: 1, maxLength: 256}
                        source: {type: string, minLength: 1, maxLength: 128}
                        action: {type: string, minLength: 1, maxLength: 160}
                        resource_type: {type: string, minLength: 1, maxLength: 128}
                        resource_id: {type: string, minLength: 1, maxLength: 512}
                        correlation_id: {type: string, minLength: 1, maxLength: 256}
                        risk: {type: string, enum: [read, write_safe, write_sensitive, legally_significant, unclassified]}
                        summary: {type: object, additionalProperties: true}
                        created_at: {type: string, format: date-time}
                  next_cursor: {type: string, maxLength: 128}
        '400': {description: Invalid page limit or cursor}
        '401': {description: Authenticated tenant scope missing}
        '403': {description: Caller lacks audit.read}
  /webhook-subscriptions:
    get:
      operationId: listWebhookSubscriptions
      responses:
        '200':
          description: Tenant-scoped webhook subscriptions; signing secret references are never exposed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalWebhooksSubscriptionListV1'}
        '401': {description: Authenticated tenant scope missing}
    post:
      operationId: createWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalWebhooksCreateSubscriptionV1'}
      responses:
        '201':
          description: Webhook subscription created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalWebhooksSubscriptionV1'}
        '400': {description: 'Invalid subscription, event allowlist, signing secret or unsafe endpoint'}
        '401': {description: Authenticated tenant scope missing}
        '409': {description: Subscription already exists}
  /webhooks/commerce/{connector_id}/{organization_id}/{workspace_id}/{account_id}:
    post:
      operationId: receiveCommerceWebhook
      security: []
      description: >-
        Public provider callback boundary. The connector account, tenant scope
        and provider signature are resolved and verified by the runtime before
        a minimized event is placed in the transactional outbox. Saleor uses
        Saleor-Signature/Saleor-Event; WooCommerce uses
        X-WC-Webhook-Signature/X-WC-Webhook-Topic. Invalid deliveries are
        acknowledged uniformly and are not persisted.
      parameters:
        - {name: connector_id, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{1,63}$'}}
        - {name: organization_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: account_id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}}
        - {name: Saleor-Signature, in: header, required: false, schema: {type: string, maxLength: 4096}}
        - {name: Saleor-Event, in: header, required: false, schema: {type: string, maxLength: 128}}
        - {name: X-WC-Webhook-Signature, in: header, required: false, schema: {type: string, maxLength: 4096}}
        - {name: X-WC-Webhook-Topic, in: header, required: false, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, maxProperties: 10000, additionalProperties: true}
      responses:
        '200':
          description: Uniform provider acknowledgement; verification failures are not disclosed.
          content:
            application/json:
              schema: {type: object, additionalProperties: false}
        '404': {description: Route not found}
  /webhooks/social/{connector_id}/{organization_id}/{workspace_id}/{account_id}:
    post:
      operationId: receiveSocialWebhook
      security: []
      description: >-
        Public provider callback boundary for admitted social connectors. The
        connector account, tenant scope, configured channel and provider
        verification token are checked before a minimized event is claimed in
        the tenant-scoped Inbox and transactional outbox. Telegram uses
        X-Telegram-Bot-Api-Secret-Token and accepts only channel post updates;
        MAX uses X-Max-Bot-Api-Secret. Invalid deliveries are acknowledged
        uniformly and are not persisted.
      parameters:
        - {name: connector_id, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{1,63}$'}}
        - {name: organization_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: workspace_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: account_id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}}
        - {name: X-Telegram-Bot-Api-Secret-Token, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: X-Max-Bot-Api-Secret, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 256}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, maxProperties: 10000, additionalProperties: true}
      responses:
        '200':
          description: Uniform provider acknowledgement; verification failures are not disclosed.
          content:
            application/json:
              schema: {type: object, additionalProperties: false}
        '404': {description: Route not found}
  /webhook-subscriptions/{subscription_id}:
    delete:
      operationId: disableWebhookSubscription
      parameters:
        - {name: subscription_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '204': {description: Subscription disabled and signing secret revoked; delivery history is retained}
        '401': {description: Authenticated tenant scope missing}
        '404': {description: Subscription not found in tenant scope}

  /webhook-subscriptions/{subscription_id}/rotate-secret:
    post:
      operationId: rotateWebhookSigningSecret
      parameters:
        - {name: subscription_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalWebhooksRotateSecretV1'}
      responses:
        '200':
          description: New signing secret activated; previous secret remains valid only for the bounded overlap
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalWebhooksSubscriptionV1'}
        '400': {description: Invalid secret or overlap}
        '401': {description: Authenticated tenant scope missing}
        '404': {description: Subscription not found in tenant scope}
        '409': {description: Rotation already active or concurrent change}
  /webhook-deliveries/{delivery_id}/replay:
    post:
      operationId: replayWebhookDelivery
      parameters:
        - {name: delivery_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '202':
          description: A new durable delivery was queued using the current subscription endpoint and signing secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalWebhooksReplayResponseV1'}
        '401': {description: Authenticated tenant scope missing}
        '404': {description: Delivery not found in tenant scope}
  /webhook-deliveries/{delivery_id}/history:
    get:
      operationId: getWebhookDeliveryHistory
      parameters:
        - {name: delivery_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Immutable bounded attempt history without response bodies or raw remote errors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalWebhooksDeliveryHistoryPageV1'}
        '400': {description: Invalid history query}
        '401': {description: Authenticated tenant scope missing}
        '404': {description: Delivery not found in tenant scope}
  /privacy/requests:
    post:
      operationId: createPrivacyRequest
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PrivacyRequestWrite'}}}
      responses:
        '202':
          description: Tenant-scoped privacy workflow durably queued
          content: {application/json: {schema: {$ref: '#/components/schemas/PrivacyRequestAccepted'}}}
        '400': {description: Invalid privacy request or idempotency key}
        '409': {description: Idempotency key conflicts with another privacy request}
  /counterparties:
    get:
      operationId: listCounterparties
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Tenant-scoped canonical counterparty role page
          content: {application/json: {schema: {$ref: '#/components/schemas/CounterpartyPage'}}}
        '400': {description: Invalid limit}
  /compliance/documents:
    get:
      operationId: listComplianceDocuments
      responses:
        '200':
          description: Product compliance document page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, document_type, number, jurisdiction, issuer, registry_source, registry_reference, status, issued_at, verification_source, version]
                      properties:
                        id: {type: string}
                        document_type: {type: string}
                        number: {type: string}
                        jurisdiction: {type: string}
                        issuer: {type: string}
                        registry_source: {type: string}
                        registry_reference: {type: string}
                        status: {type: string}
                        issued_at: {type: string, format: date-time}
                        expires_at: {type: string, format: date-time}
                        verification_source: {type: string}
                        verified_at: {type: string, format: date-time}
                        version: {type: integer, minimum: 1}
  /compliance/evaluate:
    post:
      operationId: evaluateProductCompliance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalComplianceEvaluationRequestV1'}
      responses:
        '200':
          description: Explainable product-compliance decision for an authenticated tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalComplianceEvaluationResultV1'}
        '400': {description: Invalid compliance evaluation request}
        '401': {description: Authenticated tenant scope missing}
  /entitlements/evaluate:
    post:
      operationId: evaluateEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalEntitlementsEvaluateRequestV1'}
      responses:
        '200':
          description: Tenant feature entitlement and optional current quota status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalEntitlementsEvaluateResponseV1'}
        '400': {description: Invalid entitlement request}
        '401': {description: Authenticated tenant scope missing}
        '404': {description: Requested quota metric has no policy}
  /fx/rates:
    get:
      operationId: listFXRates
      security: [{bearerAuth: []}]
      parameters:
        - {name: base, in: query, schema: {type: string, pattern: '^[A-Z]{3}$'}}
        - {name: quote, in: query, schema: {type: string, pattern: '^[A-Z]{3}$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Immutable sourced current/historical FX facts
          content: {application/json: {schema: {$ref: '#/components/schemas/FXRateFactPage'}}}
        '400': {description: Invalid currency pair or limit}
  /cloud/subscription:
    get:
      operationId: getCloudSubscription
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Cloud subscription state or explicit Community mode without a billing dependency
          content: {application/json: {schema: {$ref: '#/components/schemas/CloudSubscriptionState'}}}
  /uploads:
    post:
      operationId: createUpload
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: X-Filename, in: header, required: false, description: Required for application/octet-stream requests, schema: {type: string, minLength: 1, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
          application/json:
            schema: {$ref: '#/components/schemas/UploadWrite'}
      responses:
        '202':
          description: Upload durably accepted into tenant-derived S3 quarantine and security pipeline
          content: {application/json: {schema: {$ref: '#/components/schemas/UploadAccepted'}}}
        '400': {description: 'Invalid metadata, size, media type or idempotency key'}
        '409': {description: Idempotency key conflicts with different upload metadata}
        '503': {description: Quarantine object storage is unavailable; content is never released}
  /uploads/{upload_id}:
    parameters:
      - {name: upload_id, in: path, required: true, schema: {type: string, pattern: '^upl_[0-9a-f]{32}$'}}
    get:
      operationId: getUpload
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Upload lifecycle state and integrity metadata
          content: {application/json: {schema: {$ref: '#/components/schemas/UploadStatus'}}}
        '401': {description: Authenticated tenant scope missing}
        '404': {description: Upload not found in tenant scope}
  /uploads/{upload_id}/content:
    parameters:
      - {name: upload_id, in: path, required: true, schema: {type: string, pattern: '^upl_[0-9a-f]{32}$'}}
    get:
      operationId: getUploadContent
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Released object bytes, streamed with a server-sniffed content type; caller must be authorized to read products'}
        '401': {description: Authenticated tenant scope missing}
        '403': {description: Caller lacks products.read}
        '404': {description: 'Upload not found, not released, or tenant scope mismatch'}
  /plugins:
    get:
      operationId: listPlugins
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Tenant-visible reviewed plugin marketplace listings with explicit trust and requested authority
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalPluginsMarketplacePageV1'}
        '400': {description: Invalid limit}
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Authenticated principal notification inbox
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalNotificationsNotificationPageV1'}
        '400': {description: Client tenant/recipient override or invalid limit}
        '401': {description: Authenticated tenant/principal identity missing}
  /notifications/{notification_id}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - {name: notification_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200':
          description: Notification marked read idempotently
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalNotificationsNotificationV1'}
        '401': {description: Authenticated tenant/principal identity missing}
        '404': {description: Notification not found for authenticated principal}
  /notifications/{notification_id}/deliveries:
    get:
      operationId: listNotificationDeliveries
      parameters:
        - {name: notification_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200':
          description: Immutable channel delivery/suppression outcomes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalNotificationsDeliveryPageV1'}
        '401': {description: Authenticated tenant/principal identity missing}
  /notification-preferences/{channel}:
    get:
      operationId: getNotificationPreference
      parameters:
        - {name: channel, in: path, required: true, schema: {type: string, enum: [web_ui, webhook, email, sms, chat]}}
      responses:
        '200':
          description: Effective per-recipient channel preference including safe defaults
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalNotificationsPreferenceV1'}
        '401': {description: Authenticated tenant/principal identity missing}
    put:
      operationId: putNotificationPreference
      parameters:
        - {name: channel, in: path, required: true, schema: {type: string, enum: [web_ui, webhook, email, sms, chat]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalNotificationsPreferenceUpdateV1'}
      responses:
        '200':
          description: Effective per-recipient channel preference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalNotificationsPreferenceV1'}
        '400': {description: Invalid or unknown preference field}
        '401': {description: Authenticated tenant/principal identity missing}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048, pattern: '^v1\.[A-Za-z0-9_-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}
  schemas:
    AssistantSessionCreate:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, maxLength: 120}
        locale: {type: string, minLength: 2, maxLength: 16, default: ru-RU}
    AssistantSession:
      type: object
      additionalProperties: false
      required: [id, actor_id, locale, version, created_at, updated_at]
      properties:
        id: {type: string, maxLength: 192}
        actor_id: {type: string, maxLength: 192}
        title: {type: string, maxLength: 120}
        locale: {type: string, maxLength: 16}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time, pattern: 'Z$'}
        updated_at: {type: string, format: date-time, pattern: 'Z$'}
    AssistantSessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AssistantSession'}}
    AssistantMessage:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000}
        context_hint:
          type: object
          additionalProperties: false
          properties:
            kind: {type: string, pattern: '^[a-z][a-z0-9._-]{0,95}$'}
            resource_id: {type: string, maxLength: 192}
    AssistantCancel:
      type: object
