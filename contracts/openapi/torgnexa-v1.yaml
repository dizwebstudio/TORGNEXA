  /approvals:
    get:
      operationId: listApprovals
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Recent tenant-scoped approval requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
