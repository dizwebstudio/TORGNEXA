        '400': {description: "Invalid cursor, status or limit"}
        '401': {description: Missing or invalid OIDC bearer token}
        '403': {description: Caller lacks integrations.center.read}
        '404': {description: Flow is not visible in the resolved tenant}
  /marketplace-operations/findings:
    get:
      operationId: listMarketplaceOperationFindings
