        - {name: order_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200':
          description: Tenant-scoped canonical order detail with connector mappings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, order_number, status, currency, subtotal_minor_units, discount_minor_units, tax_minor_units, shipping_minor_units, grand_minor_units, placed_at, version, updated_at, items, sources]
                properties:
                  id: {type: string}
                  order_number: {type: string}
                  status: {type: string}
                  currency: {type: string}
                  subtotal_minor_units: {type: integer, minimum: 0}
                  discount_minor_units: {type: integer, minimum: 0}
                  tax_minor_units: {type: integer, minimum: 0}
                  shipping_minor_units: {type: integer, minimum: 0}
                  grand_minor_units: {type: integer, minimum: 0}
                  placed_at: {type: string, format: date-time}
                  version: {type: integer, minimum: 1}
                  updated_at: {type: string, format: date-time}
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [sku, quantity_coefficient, quantity_scale, unit, unit_price_minor_units, line_total_minor_units]
                      properties:
                        sku: {type: string}
                        product_title: {type: string, maxLength: 300}
                        product_image_url: {type: string, format: uri-reference, pattern: '^(https://[^[:space:]]+|/demo-images/demo-[0-9]+\.svg|/api/v1/uploads/upl_[0-9a-f]{32}/content)$', maxLength: 2048}
                        quantity_coefficient: {type: integer, minimum: 1}
                        quantity_scale: {type: integer, minimum: 0, maximum: 9}
                        unit: {type: string}
                        unit_price_minor_units: {type: integer, minimum: 0}
                        line_total_minor_units: {type: integer, minimum: 0}
                  sources:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [provider, remote_id]
                      properties:
                        provider: {type: string}
                        remote_id: {type: string}
        '404': {description: Order not found in authenticated workspace}
