          - publication
          - sale
          - advertising
          - shipping
        jurisdiction:
          type: string
          pattern: ^[A-Z]{2}$
        product_id:
          type: string
          pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-7][0-9A-HJKMNP-TV-Z]{25})$
        offer_id:
          type: string
          pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-7][0-9A-HJKMNP-TV-Z]{25})$
        category_id:
          type: string
          pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-7][0-9A-HJKMNP-TV-Z]{25})$
        gtin:
          type: string
          pattern: ^(?:[0-9]{8}|[0-9]{12}|[0-9]{13}|[0-9]{14})$
        sku:
          type: string
          maxLength: 128
        seller_party_id:
          type: string
          pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-7][0-9A-HJKMNP-TV-Z]{25})$
        seller_role:
          type: string
          maxLength: 128
        connector_id:
          type: string
          maxLength: 128
        connector_family:
          type: string
          maxLength: 128
        at:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
    ExternalComplianceEvaluationResultV1:
      additionalProperties: false
      title: Compliance Evaluation Result v1
      type: object
      required:
      - outcome
      - reasons
      - evaluated_at
      - fingerprint_sha256
      properties:
        outcome:
          enum:
          - allow
          - warn
          - approval_required
          - block
        reasons:
          type: array
          maxItems: 512
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - policy_id
            - policy_version
            - document_type
            properties:
              code:
                enum:
                - missing_evidence
                - expired_evidence
                - unverified_evidence
                - invalid_evidence
              policy_id:
                type: string
                pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-7][0-9A-HJKMNP-TV-Z]{25})$
              policy_version:
                type: integer
                minimum: 1
              document_type:
                enum:
                - declaration
                - certificate
                - eac_evidence
                - state_registration
                - veterinary
                - sanitary
                - refusal_letter
                - information_letter
                - other
              evidence_ids:
                type: array
                maxItems: 256
                items:
                  type: string
                  pattern: ^(?:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-7][0-9A-HJKMNP-TV-Z]{25})$
        evaluated_at:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$
        fingerprint_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    ExternalEntitlementsEvaluateRequestV1:
      title: Entitlement Evaluate Request v1
      type: object
      additionalProperties: false
      required:
      - feature
      properties:
        feature:
          type: string
          pattern: ^[a-z][a-z0-9._:/-]{0,127}$
        metric:
          type: string
          pattern: ^[a-z][a-z0-9._:/-]{0,127}$
    ExternalEntitlementsEvaluateResponseV1:
      title: Entitlement Evaluate Response v1
      type: object
      additionalProperties: false
      required:
      - evaluation
      properties:
        evaluation:
          type: object
          additionalProperties: false
          required:
          - feature
          - allowed
          - reason_code
          - evaluated_at
          properties:
            feature:
              type: string
              pattern: ^[a-z][a-z0-9._:/-]{0,127}$
            allowed:
              type: boolean
            reason_code:
              enum:
              - no_entitlement
              - entitlement_enabled
              - entitlement_disabled
            rule_id:
              type: string
            rule_version:
              type: integer
              minimum: 1
            evaluated_at:
              type: string
              format: date-time
              pattern: Z$
          allOf:
          - if:
              required:
              - rule_id
            then:
              required:
              - rule_version
        quota:
          type: object
          additionalProperties: false
          required:
          - metric
          - limit
          - used
          - remaining
          - window_start
          - window_end
          - policy_id
          - policy_version
          properties:
            metric:
              type: string
              pattern: ^[a-z][a-z0-9._:/-]{0,127}$
            limit:
              type: integer
              minimum: 0
            used:
              type: integer
              minimum: 0
            remaining:
              type: integer
              minimum: 0
            window_start:
              type: string
              format: date-time
              pattern: Z$
            window_end:
              type: string
              format: date-time
              pattern: Z$
            policy_id:
              type: string
            policy_version:
              type: integer
              minimum: 1
    ExternalNotificationsDeliveryPageV1:
      title: TORGNEXA Notification Delivery Page v1
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalNotificationsDeliveryPageV1/$defs/delivery'
      $defs:
        delivery:
          type: object
          additionalProperties: false
          required:
          - notification_id
          - channel
          - status
          - occurrence
          - attempt
          - attempted_at
          properties:
            notification_id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
            channel:
              enum:
              - web_ui
              - webhook
            status:
              enum:
              - succeeded
              - suppressed
              - failed
            error_code:
              type: string
              pattern: ^[a-z][a-z0-9_]{0,63}$
            occurrence:
              type: integer
              minimum: 1
            attempt:
              type: integer
              minimum: 1
              maximum: 64
            attempted_at:
              type: string
              format: date-time
              pattern: Z$
          allOf:
          - if:
              properties:
                status:
                  const: failed
              required:
              - status
            then:
              required:
              - error_code
            else:
              not:
                required:
                - error_code
