        code: {type: string, minLength: 1, maxLength: 8192}
        state: {type: string, minLength: 32, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
        callback_url: {type: string, format: uri, maxLength: 2048, description: Must be identical to the URL bound when authorization started}
    ExternalComplianceEvaluationRequestV1:
      additionalProperties: false
