          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/id'
        dedupe_key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
        severity:
          enum:
          - info
          - warning
          - critical
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          maxLength: 4000
        entity_type:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/id'
        entity_id:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/id'
        source_event_id:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/id'
        source_event_type:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*\.[a-z][a-z0-9]*(?:_[a-z0-9]+)*\.[a-z][a-z0-9]*(?:_[a-z0-9]+)*\.v[1-9][0-9]{0,2}$
        occurrence_count:
          type: integer
          minimum: 1
        first_occurred_at:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/utc'
        last_occurred_at:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/utc'
        read_at:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/utc'
        created_at:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/utc'
        updated_at:
          $ref: '#/components/schemas/ExternalNotificationsNotificationV1/$defs/utc'
      $defs:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
        utc:
          type: string
          format: date-time
          pattern: Z$
      dependentRequired:
        entity_type:
        - entity_id
        entity_id:
        - entity_type
        source_event_id:
        - source_event_type
        source_event_type:
        - source_event_id
    ExternalNotificationsPreferenceUpdateV1:
