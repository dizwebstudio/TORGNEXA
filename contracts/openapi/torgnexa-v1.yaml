        expected_version: {type: integer, minimum: 1}
        callback_url: {type: string, format: uri, maxLength: 2048, description: Must exactly match an allowed deployment origin plus /oauth/connectors/callback}
    ConnectorOAuthStartResult:
      type: object
      additionalProperties: false
