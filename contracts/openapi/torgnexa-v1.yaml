        '200':
          description: Authorization code exchanged and encrypted token bundle bound; account remains disabled and unvalidated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorAccountSettings'}
        '400': {description: Callback is outside the exact deployment allowlist or request is invalid}
        '409': {description: 'State is expired, already consumed, actor-bound to another session or account version changed'}
        '422': {description: Connector OAuth configuration is invalid}
        '502': {description: OAuth provider rejected or did not complete the bounded exchange}
  /connector-accounts:capabilities:
    put:
      operationId: replaceConnectorAccountCapabilities
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
