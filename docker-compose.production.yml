# Production overlay for a single small VPS.
# Run with: docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env up -d --build
# The base file's host bindings remain loopback-only; publish only API, frontend
# and Keycloak through the host TLS edge (Caddy/Nginx or a managed proxy).

name: torgnexa-production

services:
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT

  keycloak:
    command: [start, --import-realm]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME to the public HTTPS hostname}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8081}:8080

  api:
    # Allow the default LM Studio endpoint to reach a host-local daemon on
    # Linux Docker as well as Docker Desktop. This is an explicit host gateway
    # mapping; the application still enforces its own local destination
    # allowlist and pinned dialing.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TORGNEXA_ENV: production
      TORGNEXA_HTTP_ADDR: 0.0.0.0:8080
      TORGNEXA_OIDC_ISSUER: ${TORGNEXA_OIDC_ISSUER:?set the HTTPS OIDC issuer URL}
      TORGNEXA_OIDC_USERINFO_URL: ${TORGNEXA_OIDC_USERINFO_URL:?set the HTTPS OIDC userinfo URL}
      TORGNEXA_OIDC_DEVELOPMENT_ORGANIZATION_ID: ""
      TORGNEXA_OIDC_DEVELOPMENT_WORKSPACE_ID: ""
      TORGNEXA_SECURITY_TRUSTED_PROXY_CIDRS: ${TORGNEXA_SECURITY_TRUSTED_PROXY_CIDRS:?set trusted proxy CIDRs}
      TORGNEXA_SECURITY_ADMIN_CIDRS: ${TORGNEXA_SECURITY_ADMIN_CIDRS:?set admin CIDRs}
      TORGNEXA_SECURITY_ALLOWED_ORIGINS: ${TORGNEXA_SECURITY_ALLOWED_ORIGINS:?set the public HTTPS origin}
      TORGNEXA_SECRETS_KEY_ID: ${TORGNEXA_SECRETS_KEY_ID:-production-v1}
    ports:
      - 127.0.0.1:${TORGNEXA_API_PORT:-8080}:8080

  worker:
    environment:
      TORGNEXA_ENV: production
      TORGNEXA_SECRETS_KEY_ID: ${TORGNEXA_SECRETS_KEY_ID:-production-v1}
      TORGNEXA_WORKER_UPLOADS_ENABLED: ${TORGNEXA_WORKER_UPLOADS_ENABLED:-false}

  scheduler:
    environment:
      TORGNEXA_ENV: production
      TORGNEXA_SECRETS_KEY_ID: ${TORGNEXA_SECRETS_KEY_ID:-production-v1}

  mcp:
    environment:
      TORGNEXA_ENV: production
      TORGNEXA_HTTP_ADDR: 0.0.0.0:8090
      TORGNEXA_OIDC_ISSUER: ${TORGNEXA_OIDC_ISSUER:?set the HTTPS OIDC issuer URL}
      TORGNEXA_OIDC_USERINFO_URL: ${TORGNEXA_OIDC_USERINFO_URL:?set the HTTPS OIDC userinfo URL}
      TORGNEXA_OIDC_DEVELOPMENT_ORGANIZATION_ID: ""
      TORGNEXA_OIDC_DEVELOPMENT_WORKSPACE_ID: ""
      TORGNEXA_SECURITY_TRUSTED_PROXY_CIDRS: ${TORGNEXA_SECURITY_TRUSTED_PROXY_CIDRS:?set trusted proxy CIDRs}
      TORGNEXA_SECURITY_ADMIN_CIDRS: ${TORGNEXA_SECURITY_ADMIN_CIDRS:?set admin CIDRs}
      TORGNEXA_SECURITY_ALLOWED_ORIGINS: ${TORGNEXA_SECURITY_ALLOWED_ORIGINS:?set the public HTTPS origin}
      TORGNEXA_SECRETS_KEY_ID: ${TORGNEXA_SECRETS_KEY_ID:-production-v1}
    ports:
      - 127.0.0.1:${TORGNEXA_MCP_PORT:-8090}:8090

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    ports:
      - 127.0.0.1:${TORGNEXA_FRONTEND_PORT:-5173}:5173
