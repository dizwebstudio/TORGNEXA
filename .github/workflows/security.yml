name: supply-chain-security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GOTELEMETRY: "off"
      GOTOOLCHAIN: local
      GOWORK: "off"
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the approved Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.7"
          cache: false
      - name: Install the approved Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.16.0"
      - name: Audit the locked JavaScript build graph
        run: |
          ./scripts/check-js-supply-chain.sh repository
          npm --prefix integrations/n8n-nodes-torgnexa ci --ignore-scripts --no-fund
          npm --prefix integrations/n8n-nodes-torgnexa audit --audit-level=high
      - name: Install checksum-verified security tools
        env:
          TOOLS_DIR: ${{ runner.temp }}/torgnexa-security-tools
          REPORT_DIR: ${{ runner.temp }}/torgnexa-source-reports
        run: |
          mkdir -m 0700 -- "$TOOLS_DIR" "$REPORT_DIR"
          ./scripts/install-security-tools.sh --bin-dir "$TOOLS_DIR"
      - name: Verify deterministic JavaScript dependency policy
        run: ./scripts/check-js-supply-chain.sh repository
      - name: Scan source and dependencies
        env:
          TOOLS_DIR: ${{ runner.temp }}/torgnexa-security-tools
          REPORT_DIR: ${{ runner.temp }}/torgnexa-source-reports
          TORGNEXA_SAFE_OUTPUT_ROOT: ${{ runner.temp }}
        run: |
          ./scripts/scan-supply-chain.sh \
            --mode dry-run \
            --scope source \
            --source-revision "$SOURCE_REVISION" \
            --tool-dir "$TOOLS_DIR" \
            --output-dir "$REPORT_DIR"
      - name: Retain sanitized source reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supply-chain-source-${{ github.run_id }}
          path: ${{ runner.temp }}/torgnexa-source-reports
          if-no-files-found: error
          retention-days: 30

  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GOTELEMETRY: "off"
      GOTOOLCHAIN: local
      GOWORK: "off"
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the approved Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.7"
          cache: false
      - name: Install checksum-verified security tools
        env:
          TOOLS_DIR: ${{ runner.temp }}/torgnexa-security-tools
          REPORT_DIR: ${{ runner.temp }}/torgnexa-image-reports
        run: |
          mkdir -m 0700 -- "$TOOLS_DIR" "$REPORT_DIR"
          ./scripts/install-security-tools.sh --bin-dir "$TOOLS_DIR"
      - name: Scan every pinned runtime image and platform
        env:
          TOOLS_DIR: ${{ runner.temp }}/torgnexa-security-tools
          REPORT_DIR: ${{ runner.temp }}/torgnexa-image-reports
          TORGNEXA_SAFE_OUTPUT_ROOT: ${{ runner.temp }}
        run: |
          ./scripts/scan-supply-chain.sh \
            --mode dry-run \
            --scope images \
            --source-revision "$SOURCE_REVISION" \
            --tool-dir "$TOOLS_DIR" \
            --output-dir "$REPORT_DIR"
      - name: Retain sanitized image reports and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supply-chain-images-${{ github.run_id }}
          path: ${{ runner.temp }}/torgnexa-image-reports
          if-no-files-found: error
          retention-days: 30
