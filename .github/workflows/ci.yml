name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTELEMETRY: "off"
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the approved Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.7"
          cache: false
      - name: Build the trusted base verifier and validate the pull-request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNNER_TEMP" == /* && "$GITHUB_WORKSPACE" == /* ]]
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD)" == "$HEAD_REVISION" ]]
          trusted_base="$RUNNER_TEMP/torgnexa-architecture-base"
          trusted_checker="$RUNNER_TEMP/torgnexa-architecturecheck"
          trusted_cache="$RUNNER_TEMP/torgnexa-architecture-gocache"
          trusted_home="$RUNNER_TEMP/torgnexa-architecture-home"
          [[ ! -e "$trusted_base" && ! -e "$trusted_checker" && ! -e "$trusted_cache" && ! -e "$trusted_home" ]]
          mkdir -m 0700 -- "$trusted_cache" "$trusted_home"
          git -C "$GITHUB_WORKSPACE" cat-file -e "$BASE_REVISION^{commit}"
          git -C "$GITHUB_WORKSPACE" -c core.hooksPath=/dev/null worktree add --detach "$trusted_base" "$BASE_REVISION"
          [[ "$(git -C "$trusted_base" rev-parse --verify HEAD)" == "$BASE_REVISION" ]]
          (
            cd -- "$trusted_base"
            env -i \
              CGO_ENABLED=0 \
              GOCACHE="$trusted_cache" \
              GOENV=off \
              GOTELEMETRY=off \
              GOTOOLCHAIN=local \
              GOWORK=off \
              GOPROXY=off \
              GOSUMDB=off \
              HOME="$trusted_home" \
              LC_ALL=C \
              PATH="$PATH" \
              TMPDIR="$RUNNER_TEMP" \
              TZ=UTC \
              go build -buildvcs=false -mod=readonly -trimpath -o "$trusted_checker" ./tools/architecturecheck
          )
          [[ -f "$trusted_checker" && ! -L "$trusted_checker" ]]
          env -i HOME="$trusted_home" LC_ALL=C PATH=/usr/bin:/bin TZ=UTC \
            "$trusted_checker" --root "$GITHUB_WORKSPACE" --base "$BASE_REVISION" --head "$HEAD_REVISION"
      - name: Run repository checks
        run: ./scripts/check.sh
      - name: Verify deterministic JavaScript dependency policy
        run: ./scripts/check-js-supply-chain.sh repository
      - name: Verify PostgreSQL tenancy migration and RLS
        run: ./scripts/check-tenancy-postgres.sh
      - name: Verify PostgreSQL logical restore and physical PITR
        run: ./scripts/check-postgres-backup-restore.sh
      - name: Rehearse PostgreSQL upgrade and resumable backfill
        run: ./scripts/check-postgres-upgrade.sh
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the approved Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.16.0"
      - name: Verify JavaScript dependency policy
        run: ./scripts/check-js-supply-chain.sh repository
      - name: Install the exact n8n build graph without lifecycle scripts
        working-directory: integrations/n8n-nodes-torgnexa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, test, and inspect the n8n package
        working-directory: integrations/n8n-nodes-torgnexa
        run: |
          npm run build
          npm run test:offline
          npm run verify:package
          npm pack --dry-run --ignore-scripts
