# TORGNEXA Community security-edge baseline (example; tune addresses/limits per deployment).
limit_req_zone $binary_remote_addr zone=torgnexa_api:10m rate=60r/m;
server {
    listen 443 ssl http2;
    server_name _;
    server_tokens off;
    client_max_body_size 10g;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
    location / {
        limit_req zone=torgnexa_api burst=30 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://torgnexa_api;
    }
}
