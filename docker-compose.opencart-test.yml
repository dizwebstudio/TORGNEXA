name: torgnexa-opencart-test

services:
  db:
    image: mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
    environment:
      MARIADB_ROOT_PASSWORD: opencart-root-demo
      MARIADB_DATABASE: opencart
      MARIADB_USER: opencart
      MARIADB_PASSWORD: opencart-demo
    volumes:
      - opencart-demo-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  opencart:
    build:
      context: .
      dockerfile: docker/opencart-test/Dockerfile
      args:
        OPENCART_VERSION: "4.1.0.4"
        OPENCART_SHA256: cdef537f5a0a7e1b4ddbe16f589dd2e80b10150a09bfbe93ce76ef2d5c3218c0
    environment:
      DB_HOSTNAME: db
      DB_USERNAME: opencart
      DB_PASSWORD: opencart-demo
      DB_DATABASE: opencart
      DB_PORT: "3306"
      DB_PREFIX: oc_
      OPENCART_USERNAME: admin
      OPENCART_PASSWORD: admin-demo-123
      OPENCART_ADMIN_EMAIL: demo@torgnexa.local
      OPENCART_HTTP_SERVER: http://127.0.0.1:${OPENCART_HTTP_PORT:-8095}/
      TORGNEXA_OPENCART_BRIDGE_TOKEN: torgnexa-demo-bridge-token-2026
    ports:
      - "${OPENCART_HTTP_PORT:-8095}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${TORGNEXA_OPENCART_BRIDGE_TOKEN}\" 'http://127.0.0.1/index.php?route=extension/torgnexa/api/health' | grep -q '\"api_version\":\"v1\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  opencart-demo-db:
